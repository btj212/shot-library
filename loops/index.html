<header><h1>Shot Library: Loops <span id="cnt"></span><a href="https://btj212.github.io/shot-library/">← Full gallery &amp; guides</a></h1>

<span class="tg" id="sd">Seedance 2.5 only</span></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Full shot"><div class="lbp" id="lbp"><button class="lbx" id="lbx" aria-label="Close">×</button><div class="lbm" id="lbm"></div><div class="lbi" id="lbi"></div></div></div>
<script>
let E=[];const FB=/github\.io$/.test(location.hostname)||/\/loops\//.test(location.pathname)?'../':'/g/';
function media(p,t){return Promise.resolve(p)}
window.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('d.json',{cache:'no-cache'});start(await r.json())});
const CATS=[['all','All'],['camera','Camera moves/shots'],['transitions','Transitions'],['aesthetic','Aesthetic/genre'],['mood','Mood'],['prop','Prop styling'],['wardrobe','Wardrobe'],['grain','Grain/filter'],['realism','Realism'],['performance','Performance']];
let st={sec:'motion',cat:'all',tag:'',q:'',model:'',sd:false},shown=0,V=[];const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const _t=new Date(),T0=new Date(_t.getFullYear(),_t.getMonth(),_t.getDate());

const fam=m=>(m||'').replace(/\s*\(.*$/,'');const isSD=e=>/Seedance 2\.5/.test(e.model);
function start(d){E=d;const lg=document.getElementById('lg');if(lg)lg.remove();const h=new URLSearchParams(location.hash.slice(1));if(h.get('s')=='stills')st.sec='stills';if(h.get('c'))st.cat=h.get('c');if(h.get('q'))st.q=$('#q').value=h.get('q');
 $('#q').oninput=()=>{st.q=$('#q').value;render()};$('#q').onkeydown=ev=>{if(ev.key=='Enter')$('#q').blur()};$('#model').onchange=()=>{st.model=$('#model').value;render()};$('#sd').onclick=()=>{st.sd=!st.sd;render()};render();if(h.get('open'))openM(h.get('open'))}
function sec(){return E.filter(e=>e.section==st.sec)}
function base(){return sec().filter(e=>(st.cat=='all'||(st.cat=='new'?isNew(e):e.category==st.cat))&&(!st.sd||isSD(e)))}
function vis(){const q=st.q.toLowerCase();const r=base().filter(e=>(!st.tag||(e.subtags||[]).includes(st.tag))&&(!st.model||fam(e.model)==st.model)&&(!q||[e.title,e.prompt,e.adapted_prompt||'',e.creator,e.model,(e.subtags||[]).join(' '),e.id].join(' ').toLowerCase().includes(q)));return rank(r,q)}
// ranking: (with a query) title/tag/ID/category matches before prompt-body-only matches; then per-query demotions; NEW first within each tier; otherwise library order
const DEMOTE={fpv:['PRP-014']};
function rank(r,q){const dm=DEMOTE[q.trim()]||[];const tier=e=>{if(!q)return 0;let t=[e.title,(e.subtags||[]).join(' '),e.id,e.category_label].join(' ').toLowerCase().includes(q)?0:[e.creator,e.model].join(' ').toLowerCase().includes(q)?1:2;return t+(dm.includes(e.id)?10:0)};
 return r.map((e,i)=>[tier(e),isNew(e)?0:1,i,e]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]).map(x=>x[3])}
function head(){const m=E.filter(e=>e.section=='motion'),s=E.filter(e=>e.section=='stills');
 $('#cnt').textContent=`${E.length} prompts · ${m.filter(e=>e.kind=='loop').length} video loops · ${s.length} stills`;
 $('#split').innerHTML=`<div class="sec motion ${st.sec=='motion'?'on':''}" data-s="motion"><b>▶ Motion · ${m.length}</b><small>Video-model prompts (Seedance, Kling, Veo, Runway…) with a short muted loop cut from the real output</small></div>
 <div class="sec stills ${st.sec=='stills'?'on':''}" data-s="stills"><b>◼ Stills · ${s.length}</b><small>Image-model prompts (GPT Image, Nano Banana, Seedream, Midjourney…). Still images, no motion</small></div>`;
 document.querySelectorAll('.sec').forEach(t=>t.onclick=()=>{if(st.sec==t.dataset.s)return;st.sec=t.dataset.s;st.cat='all';st.tag='';st.model='';st.sd=false;render();scrollTo(0,0)});
 document.body.classList.toggle('stl',st.sec=='stills');$('#sd').style.display=st.sec=='motion'?'':'none';$('#sd').classList.toggle('on',st.sd);
 const S=sec(),nN=S.filter(isNew).length;if(st.cat=='new'&&!nN)st.cat='all';$('#tabs').innerHTML=CATS.map(([k,n])=>{const c=k=='all'?S.length:S.filter(e=>e.category==k).length;return c?`<span class="tab ${st.cat==k?'on':''}" data-c="${k}">${n}<small>${c}</small></span>`:''}).join('').replace('</span>',`</span>${nN?`<span class="tab nt ${st.cat=='new'?'on':''}" data-c="new">✦ New<small>${nN}</small></span>`:''}`);
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{st.cat=t.dataset.c;st.tag='';render()});
 const mc={};S.forEach(e=>{const f=fam(e.model);mc[f]=(mc[f]||0)+1});if(st.model&&!mc[st.model])st.model='';
 $('#model').innerHTML='<option value="">All models</option>'+Object.entries(mc).sort((a,b)=>b[1]-a[1]).map(([f,n])=>`<option value="${esc(f)}" ${st.model==f?'selected':''}>${esc(f)} (${n})</option>`).join('');
 const c={};base().forEach(e=>(e.subtags||[]).forEach(t=>c[t]=(c[t]||0)+1));
 $('#chips').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,60).map(([t,n])=>`<span class="chip ${st.tag==t?'on':''}" data-t="${esc(t)}">${esc(t)} ${n}</span>`).join('');
 document.querySelectorAll('.chip').forEach(t=>t.onclick=()=>{st.tag=st.tag==t.dataset.t?'':t.dataset.t;render()})}
function badge(e){if(e.kind=='loop')return '<span class="fs">⤢ Full shot</span>';

function card(e){const isV=e.mt=='video/mp4';
 return `<div class="card" id="${e.id}"><div class="th">${e.f?(isV?`<video muted loop playsinline preload="none" data-f="${e.f}"></video>`:`<img alt="" data-f="${e.f}">`):''}${badge(e)}<span class="badge r" style="top:auto;bottom:8px;left:8px;right:auto">${e.id}</span>${e.yt&&e.kind!='loop'?`<button class="ytb" data-yt="${e.yt}">▶ Play source on YouTube</button>`:''}</div>
 <div class="cb"><h3>${isNew(e)?'<span class="nb">NEW</span>':''}${esc(e.title)}</h3><div class="meta"><span>${esc(e.category_label)}</span><span class="mo">${esc(e.model)}</span>${e.creator?`<span>${esc(e.creator)}</span>`:''}<a href="${esc(e.source_url)}" target="_blank" rel="noopener">Source ↗</a></div>
 <div class="lbl">Prompt${e.prompt_truncated?' (truncated at source)':''}<button class="cp" data-k="prompt">Copy</button></div><div class="pw"><pre>${esc(e.prompt)}</pre></div><button class="more" hidden>Show full prompt ▾</button>
 ${e.prompt_verbatim===false?'<div class="warn">Note: prompt is not verbatim (see full gallery notes).</div>':''}
 ${e.adapted_prompt?`<details><summary>★ Our Seedance 2.5 adaptation (not the original prompt)</summary><div class="lbl">Adapted prompt<button class="cp" data-k="adapted_prompt">Copy</button></div><div class="pw adw"><pre class="adapt">${esc(e.adapted_prompt)}</pre></div><button class="more" hidden>Show full prompt ▾</button></details>`:''}</div></div>`}
const IO=new IntersectionObserver(es=>es.forEach(async x=>{const el=x.target;
 if(x.isIntersecting){if(LOCK())return;if(!el.src){const e=E.find(z=>z.f==el.dataset.f);try{el.src=await media(el.dataset.f,e.mt)}catch(err){console.error(err)}}if(el.tagName=='VIDEO')el.play().catch(()=>{})}
 else if(el.tagName=='VIDEO')el.pause()}),{rootMargin:'400px 0px'});
const LOCK=()=>document.documentElement.classList.contains('lock');
function copyT(t,b){const done=()=>{b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1200)};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();done()})}
function fit(root){root.querySelectorAll('.pw').forEach(w=>{const p=w.querySelector('pre'),m=w.nextElementSibling;if(!p||!p.offsetParent||w.classList.contains('open'))return;const o=p.scrollHeight>p.clientHeight+2;w.classList.toggle('ovf',o);if(m&&m.classList.contains('more'))m.hidden=!o})}
function wire(c,e){c.querySelectorAll('button.cp').forEach(b=>b.onclick=ev=>{ev.stopPropagation();copyT(e[b.dataset.k],b)});
 c.querySelectorAll('button.more').forEach(m=>m.onclick=()=>{const w=m.previousElementSibling,o=w.classList.toggle('open');m.textContent=o?'Show less ▴':'Show full prompt ▾';if(!o)w.scrollIntoView({block:'nearest'})});
 c.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>fit(d)));fit(c)}
let lastF=null,paused=[];
async function openM(id){const e=E.find(z=>z.id==id);if(!e)return;lastF=document.activeElement;
 paused=[...document.querySelectorAll('.grid video')].filter(v=>!v.paused);paused.forEach(v=>v.pause());
 const lp=e.f?await media(e.f,e.mt).catch(()=>''):'';
 const pu=!lp&&e.poster?await media(FB+e.poster,'image/jpeg').catch(()=>''):'';
 const NA=`<div class="na">Preview unavailable<a class="src" href="${esc(e.source_url)}" target="_blank" rel="noopener">View source ↗</a></div>`;
 const ph=lp?(e.mt=='video/mp4'?`<video src="${lp}" muted loop playsinline autoplay></video>`:`<img alt="" src="${lp}">`):(pu?`<img alt="" src="${pu}">`:'');
 // never leave the pane black: placeholder (loop, else poster) -> full shot; any media error falls back one step, ending at a 'Preview unavailable' message
 const live=()=>$('#lb').classList.contains('on')&&$('#lb').dataset.id==id;
 const showPH=msg=>{if(!live())return;$('#lbm').innerHTML=ph?ph+(msg?`<span class="ld">${msg}</span>`:''):NA;guard(false)};
 const guard=full=>$('#lbm').querySelectorAll('video,img').forEach(m=>m.addEventListener('error',()=>full?showPH('Full shot unavailable, showing '+(e.mt=='video/mp4'?'loop':'preview')):live()&&($('#lbm').innerHTML=NA)));
